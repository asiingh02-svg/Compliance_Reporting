<div class="flex-between mt-1" style="margin-bottom:1rem;">
  <h2 style="margin:0;">Compliance Certificates</h2>
  <div id="cert-centre-selector-wrapper" class="hidden" style="min-width:220px;">
    <select id="cert-centre-select"></select>
  </div>
</div>
<div class="flex-gap mt-1" style="margin-bottom:1rem;">
  <select id="cert-status-filter">
    <option value="All">All Statuses</option>
    <option value="overdue">🔴 Overdue</option>
    <option value="dueSoon">🟡 Due Soon</option>
    <option value="ok">🟢 OK</option>
    <option value="static">⚪ Static</option>
  </select>
  <button class="btn btn-secondary btn-small" id="cert-add-btn">+ Add Item</button>
</div>
<div id="cert-content"></div>

<script>
async function initComplianceCertificates() {
  const session = Session.get();
  const isAdmin = session.role === 'Area Manager' || session.role === 'Approved Provider';
  const wrapper = document.getElementById('cert-centre-selector-wrapper');
  let activeCentreId = session.centreId;

  if (isAdmin) {
    wrapper.classList.remove('hidden');
    const selectEl = document.getElementById('cert-centre-select');
    await populateCentreSelect(selectEl, function(centreId) {
      activeCentreId = centreId;
      renderCertificates(centreId);
    });
  } else {
    wrapper.classList.add('hidden');
    renderCertificates(session.centreId);
  }

  document.getElementById('cert-status-filter').addEventListener('change', function() {
    renderCertificates(activeCentreId);
  });

  document.getElementById('cert-add-btn').addEventListener('click', function() {
    openAddCertificateModal(activeCentreId, isAdmin, function() { renderCertificates(activeCentreId); });
  });
}

function certStatusBadge(status) {
  const map = {
    overdue: '<span class="badge badge-red">🔴 Overdue</span>',
    dueSoon: '<span class="badge badge-yellow">🟡 Due Soon</span>',
    ok: '<span class="badge badge-green">🟢 OK</span>',
    static: '<span class="badge badge-grey">⚪ Static</span>',
    unknown: '<span class="badge badge-grey">— No Date</span>'
  };
  return map[status] || map.unknown;
}

async function renderCertificates(centreId) {
  const contentEl = document.getElementById('cert-content');
  contentEl.innerHTML = '<p class="text-muted">Loading...</p>';
  const statusFilter = document.getElementById('cert-status-filter').value;
  const period = await getCurrentPeriodClient();
  const items = await api('getCertificatesData', centreId, statusFilter, 'All');

  const session = Session.get();
  const isAdmin = session.role === 'Area Manager' || session.role === 'Approved Provider';
  const canEdit = isAdmin || (session.role === 'Director' && session.centreId === centreId);

    let html = '<div class="data-table"><div class="table-header">' +
    renderHeaderCell('col-text-short', 'Item', 'Compliance Certificates', 'ItemName') +
    renderHeaderCell('col-narrow', 'Frequency', 'Compliance Certificates', 'Frequency') +
    renderHeaderCell('col-date', 'Next Due', 'Compliance Certificates', 'NextDue') +
    '<div class="col-narrow">Status</div>' +
    renderHeaderCell('col-narrow', 'Reviewed', 'Compliance Certificates', 'LastReviewedPeriod') +
    '<div class="col-narrow">Action</div></div>';

  items.forEach(function(item) {
    html += '<div class="table-row">';
    html += '<div class="col-text-short" data-label="Item"><strong>' + item.itemName + '</strong>' +
      (item.vendorContact ? '<br><span class="text-muted">' + item.vendorContact + '</span>' : '') +
      ' <a href="#" class="view-history-link" data-item="' + encodeURIComponent(item.itemName) + '" style="font-size:0.8rem;">View history</a></div>';
    html += '<div class="col-narrow" data-label="Frequency">' + item.frequency + '</div>';
    html += '<div class="col-date" data-label="Next Due">' + item.nextDueDisplay + '</div>';
    html += '<div class="col-narrow" data-label="Status">' + certStatusBadge(item.status) + '</div>';
    const reviewed = item.lastReviewedPeriod === period.periodKey;
    html += '<div class="col-narrow" data-label="Reviewed">' +
      '<input type="checkbox" class="cert-reviewed-checkbox" data-row="' + item.rowIndex + '" ' + (reviewed ? 'checked' : '') + ' ' + (!canEdit ? 'disabled' : '') + '></div>';
    html += '<div class="col-narrow" data-label="Action">' +
      (canEdit && item.frequency !== 'Static' ? '<button class="btn btn-secondary btn-small mark-completed-btn" data-row="' + item.rowIndex + '">Mark Completed</button>' : '—') + '</div>';
    html += '</div>';
  });
  html += '</div>';
  contentEl.innerHTML = html;

  contentEl.querySelectorAll('.cert-reviewed-checkbox').forEach(function(cb) {
    cb.addEventListener('change', async function() {
      await api('markCertificateReviewed', centreId, Number(cb.dataset.row), period.periodKey);
      showToast('Marked as reviewed for this month.', 'success');
    });
  });

  contentEl.querySelectorAll('.mark-completed-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      openMarkCompletedModal(centreId, Number(btn.dataset.row), function() { renderCertificates(centreId); });
    });
  });

  contentEl.querySelectorAll('.view-history-link').forEach(function(link) {
    link.addEventListener('click', function(e) {
      e.preventDefault();
      openCertificateHistoryModal(centreId, decodeURIComponent(link.dataset.item));
    });
  });
}

function openMarkCompletedModal(centreId, rowIndex, onDone) {
  showModal(
    '<h3 class="card-title">Mark Completed</h3>' +
    '<div class="form-group"><label>Completion Date</label><input type="date" id="mc-date"></div>' +
    '<div class="form-group"><label>Link (Drive/Document URL)</label><input type="text" id="mc-link" placeholder="https://..."></div>' +
    '<div class="flex-gap" style="justify-content:flex-end;">' +
      '<button class="btn btn-secondary" id="mc-cancel">Cancel</button>' +
      '<button class="btn btn-primary" id="mc-confirm">Save</button>' +
    '</div>'
  );
  document.getElementById('mc-cancel').addEventListener('click', closeModal);
  document.getElementById('mc-confirm').addEventListener('click', async function() {
    const date = document.getElementById('mc-date').value;
    const link = document.getElementById('mc-link').value;
    if (!date) { showToast('Please select a date.', 'error'); return; }
    closeModal();
    await api('markCertificateCompleted', centreId, rowIndex, date, link);
    showToast('Certificate updated.', 'success');
    onDone();
  });
}

async function openCertificateHistoryModal(centreId, itemName) {
  showModal('<p class="text-muted">Loading history...</p>');
  const result = await api('getFullCertificateHistory', centreId, itemName);
  let html = '<h3 class="card-title">' + itemName + ' — Full History</h3>';
  if (result.current) {
    html += '<p class="text-muted">Currently visible completions:</p><ul>';
    result.current.dates.forEach(function(d, i) {
      if (d) html += '<li>' + formatDateAU(d) + (result.current.links[i] ? ' — <a href="' + result.current.links[i] + '" target="_blank">Link</a>' : '') + '</li>';
    });
    html += '</ul>';
  }
  if (result.archived.length > 0) {
    html += '<p class="text-muted">Archived (older) completions:</p><ul>';
    result.archived.forEach(function(a) {
      html += '<li>' + formatDateAU(a.date) + (a.link ? ' — <a href="' + a.link + '" target="_blank">Link</a>' : '') + '</li>';
    });
    html += '</ul>';
  }
  html += '<button class="btn btn-secondary" id="hist-close">Close</button>';
  showModal(html);
  document.getElementById('hist-close').addEventListener('click', closeModal);
}

function openAddCertificateModal(centreId, isAdmin, onAdded) {
  showModal(
    '<h3 class="card-title">Add Certificate Item</h3>' +
    '<div class="form-group"><label>Item Name</label><input type="text" id="ac-item-name"></div>' +
    '<div class="form-group"><label>Frequency</label><select id="ac-item-freq">' +
      '<option>Monthly</option><option>Quarterly</option><option>6 Months</option><option>Yearly</option><option>2 Yearly</option><option>Static</option>' +
    '</select></div>' +
    '<div class="form-group"><label>Vendor/Contact</label><input type="text" id="ac-item-vendor"></div>' +
    '<div class="flex-gap" style="justify-content:flex-end;">' +
      '<button class="btn btn-secondary" id="ac-cancel">Cancel</button>' +
      '<button class="btn btn-primary" id="ac-confirm">Add</button>' +
    '</div>'
  );
  document.getElementById('ac-cancel').addEventListener('click', closeModal);
  document.getElementById('ac-confirm').addEventListener('click', async function() {
    const itemName = document.getElementById('ac-item-name').value.trim();
    const frequency = document.getElementById('ac-item-freq').value;
    const vendorContact = document.getElementById('ac-item-vendor').value;
    if (!itemName) { showToast('Please enter an item name.', 'error'); return; }
    closeModal();
    await api('addCertificateItem', { itemName: itemName, frequency: frequency, vendorContact: vendorContact, centreName: null });
    showToast('Item added.', 'success');
    onAdded();
  });
}
</script>
