<div class="login-wrapper" style="max-width:400px; margin:4rem auto;">
  <div class="card">
    <h2 class="card-title" style="text-align:center;">Learning Blocks</h2>
    <p class="text-muted" style="text-align:center; margin-top:-0.5rem;">Compliance Reporting</p>

    <div class="form-group mt-1">
      <label>Login ID</label>
      <input type="text" id="login-id-input" autocomplete="username">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-password-input" autocomplete="current-password">
    </div>

    <p id="login-error" class="text-muted" style="color:var(--red); display:none;"></p>

    <button class="btn btn-primary" id="login-submit-btn" style="width:100%; margin-top:0.5rem;">Log In</button>

    <p style="text-align:center; margin-top:1rem;">
      <a href="#" id="forgot-password-link" class="text-muted" style="text-decoration:underline; cursor:pointer;">Forgot password?</a>
    </p>
  </div>
</div>

<script>
function initLogin() {
  const submitBtn = document.getElementById('login-submit-btn');
  const errorEl = document.getElementById('login-error');
  const loginIdInput = document.getElementById('login-id-input');
  const passwordInput = document.getElementById('login-password-input');

  function attemptLogin() {
    errorEl.style.display = 'none';
    const loginId = loginIdInput.value.trim();
    const password = passwordInput.value;

    if (!loginId || !password) {
      errorEl.textContent = 'Please enter both your Login ID and password.';
      errorEl.style.display = 'block';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in...';

    api('loginUser', loginId, password).then(function(data) {
      if (!data.success) {
        errorEl.textContent = data.message || 'Incorrect login ID or password.';
        errorEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log In';
        return;
      }

      if (data.mustChangePassword) {
        showForcedPasswordReset(data);
      } else {
        handleLoginSuccess(data);
      }
    }).catch(function() {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log In';
    });
  }

  submitBtn.addEventListener('click', attemptLogin);
  passwordInput.addEventListener('keyup', function(e) { if (e.key === 'Enter') attemptLogin(); });

  document.getElementById('forgot-password-link').addEventListener('click', function(e) {
    e.preventDefault();
    const loginId = loginIdInput.value.trim();
    if (!loginId) {
      showToast('Please enter your Login ID first, then click Forgot Password.', 'info');
      return;
    }
    api('requestPasswordReset', loginId).then(function(result) {
      showToast(result.message, 'info');
    });
  });
}

function showForcedPasswordReset(loginData) {
  // Temporarily store the token so setNewPassword can use it, even
  // though the user hasn't "fully" logged in until they set a new password.
  Session.save(loginData);

  showModal(
    '<h3 class="card-title">Set a New Password</h3>' +
    '<p class="text-muted">For security, please choose a new password before continuing.</p>' +
    '<div class="form-group mt-1">' +
      '<label>New Password</label>' +
      '<input type="password" id="new-password-input">' +
    '</div>' +
    '<div class="form-group">' +
      '<label>Confirm New Password</label>' +
      '<input type="password" id="confirm-new-password-input">' +
    '</div>' +
    '<p id="reset-error" style="color:var(--red); display:none;"></p>' +
    '<button class="btn btn-primary" id="set-password-btn" style="width:100%;">Set Password &amp; Continue</button>'
  );

  document.getElementById('set-password-btn').addEventListener('click', function() {
    const newPw = document.getElementById('new-password-input').value;
    const confirmPw = document.getElementById('confirm-new-password-input').value;
    const errorEl = document.getElementById('reset-error');

    if (!newPw || newPw.length < 6) {
      errorEl.textContent = 'Password must be at least 6 characters.';
      errorEl.style.display = 'block';
      return;
    }
    if (newPw !== confirmPw) {
      errorEl.textContent = 'Passwords do not match.';
      errorEl.style.display = 'block';
      return;
    }

    api('setNewPassword', newPw).then(function() {
      closeModal();
      showToast('Password updated successfully.', 'success');
      handleLoginSuccess(loginData);
    });
  });
}
</script>
