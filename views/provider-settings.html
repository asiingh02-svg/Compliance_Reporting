<h2 class="mt-1" style="margin-bottom:1rem;">Provider Settings</h2>
<div class="flex-gap mt-1" style="margin-bottom:1rem;">
  <button class="ps-tab-btn tab-blue active" data-tab="users">Users</button>
  <button class="ps-tab-btn tab-purple" data-tab="centres">Centres</button>
</div>
<div id="ps-content"></div>

<script>
async function initProviderSettings() {
  document.querySelectorAll('.ps-tab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.ps-tab-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      renderPsTab(btn.dataset.tab);
    });
  });
  renderPsTab('users');
}

async function renderPsTab(tab) {
  const contentEl = document.getElementById('ps-content');
  contentEl.innerHTML = '<p class="text-muted">Loading...</p>';
  if (tab === 'users') return renderUsersTab(contentEl);
  return renderCentresTab(contentEl);
}

async function renderUsersTab(contentEl) {
  const [users, centres] = await Promise.all([api('getProviderSettingsUsers'), getCachedCentres()]);

  let html = '<button class="btn btn-primary btn-small mt-1" id="add-user-btn" style="margin-bottom:1rem;">+ Add User</button>';
  html += '<div class="data-table"><div class="table-header"><div class="col-text-short">Login ID</div><div class="col-text-short">Name</div><div class="col-narrow">Role</div><div class="col-text-short">Centre</div><div class="col-narrow">Active</div><div class="col-text-short">Actions</div></div>';
  users.forEach(function(u) {
    html += '<div class="table-row">';
    html += '<div class="col-text-short" data-label="Login ID">' + u.loginId + '</div>';
    html += '<div class="col-text-short" data-label="Name">' + u.username + '</div>';
    html += '<div class="col-narrow" data-label="Role">' + u.role + '</div>';
    html += '<div class="col-text-short" data-label="Centre">' + (u.centreName || '—') + '</div>';
    html += '<div class="col-narrow" data-label="Active">' + (u.active ? '🟢' : '🔴') + '</div>';
    html += '<div class="col-text-short" data-label="Actions"><div class="flex-gap">' +
      '<button class="btn btn-secondary btn-small u-reset" data-row="' + u.rowIndex + '">Reset Password</button>' +
      (u.active && u.role !== 'Approved Provider' ? '<button class="btn btn-danger btn-small u-deactivate" data-row="' + u.rowIndex + '">Deactivate</button>' : '') +
      (u.role === 'Approved Provider' ? '<span class="text-muted" style="font-size:0.8rem;">Protected account</span>' : '') +
      '</div></div>';
    html += '</div>';
  });
  html += '</div>';
  contentEl.innerHTML = html;

  document.getElementById('add-user-btn').addEventListener('click', function() {
    let centreOptions = centres.map(function(c) { return '<option value="' + c.centreId + '">' + c.centreName + '</option>'; }).join('');
    showModal(
      '<h3 class="card-title">Add User</h3>' +
      '<div class="form-group"><label>Login ID</label><input type="text" id="nu-loginid"></div>' +
      '<div class="form-group"><label>Name</label><input type="text" id="nu-username"></div>' +
      '<div class="form-group"><label>Role</label><select id="nu-role"><option>Director</option><option>Area Manager</option><option>Approved Provider</option></select></div>' +
      '<div class="form-group" id="nu-centre-group"><label>Centre</label><select id="nu-centre">' + centreOptions + '</select></div>' +
      '<div class="flex-gap" style="justify-content:flex-end;"><button class="btn btn-secondary" id="nu-cancel">Cancel</button><button class="btn btn-primary" id="nu-confirm">Create</button></div>'
    );
    document.getElementById('nu-cancel').addEventListener('click', closeModal);
    document.getElementById('nu-confirm').addEventListener('click', async function() {
      const loginId = document.getElementById('nu-loginid').value.trim();
      const username = document.getElementById('nu-username').value.trim();
      const role = document.getElementById('nu-role').value;
      const centreSelect = document.getElementById('nu-centre');
      const centreId = centreSelect.value;
      const centreName = centreSelect.options[centreSelect.selectedIndex].textContent;
      if (!loginId || !username) { showToast('Please fill in all fields.', 'error'); return; }
      closeModal();
      const result = await api('createUserFromSettings', { loginId: loginId, username: username, role: role, centreId: centreId, centreName: centreName });
      if (result.success) {
        showModal('<h3 class="card-title">User Created</h3><p>Login ID: <strong>' + result.loginId + '</strong></p><p>Temporary Password: <strong>' + result.tempPassword + '</strong></p><p class="text-muted">Please relay these details to the user manually.</p><button class="btn btn-primary" id="nu-done">Done</button>');
        document.getElementById('nu-done').addEventListener('click', function() { closeModal(); renderUsersTab(contentEl); });
      } else {
        showToast(result.message, 'error');
      }
    });
  });

  contentEl.querySelectorAll('.u-reset').forEach(function(btn) {
    btn.addEventListener('click', function() {
      showPasswordConfirmModal('Reset Password', 'Enter YOUR password to confirm resetting this user\'s password.', async function(pw) {
        const result = await api('resetPasswordFromSettings', Number(btn.dataset.row), pw);
        showModal('<h3 class="card-title">Password Reset</h3><p>New Temporary Password: <strong>' + result.tempPassword + '</strong></p><p class="text-muted">Please relay this to the user manually.</p><button class="btn btn-primary" id="rp-done">Done</button>');
        document.getElementById('rp-done').addEventListener('click', closeModal);
      });
    });
  });

  contentEl.querySelectorAll('.u-deactivate').forEach(function(btn) {
    btn.addEventListener('click', function() {
      showPasswordConfirmModal('Deactivate User', 'Enter your password to confirm.', async function(pw) {
        await api('deactivateUserSafe', Number(btn.dataset.row), pw);
        showToast('User deactivated.', 'success');
        renderUsersTab(contentEl);
      });
    });
  });
}

async function renderCentresTab(contentEl) {
  const centres = await api('getProviderSettingsCentres');
  let html = '<button class="btn btn-primary btn-small mt-1" id="add-centre-btn" style="margin-bottom:1rem;">+ Add Centre</button>';
  html += '<div class="data-table"><div class="table-header"><div class="col-text-short">Centre Name</div><div class="col-text-short">Director</div><div class="col-narrow">Status</div><div class="col-text-short">Address</div><div class="col-narrow">Actions</div></div>';
  centres.forEach(function(c) {
    html += '<div class="table-row">';
    html += '<div class="col-text-short" data-label="Centre">' + c.centreName + '</div>';
    html += '<div class="col-text-short" data-label="Director">' + (c.director || '—') + '</div>';
    html += '<div class="col-narrow" data-label="Status">' + (c.status === 'Active' ? '🟢 Active' : '🔴 Inactive') + '</div>';
    html += '<div class="col-text-short" data-label="Address">' + (c.address || '—') + '</div>';
    html += '<div class="col-narrow" data-label="Actions">' + (c.status === 'Active' ? '<button class="btn btn-danger btn-small c-deactivate" data-row="' + c.rowIndex + '">Deactivate</button>' : '—') + '</div>';
    html += '</div>';
  });
  html += '</div>';
  contentEl.innerHTML = html;

  document.getElementById('add-centre-btn').addEventListener('click', function() {
    showModal(
      '<h3 class="card-title">Add Centre</h3>' +
      '<div class="form-group"><label>Centre Name</label><input type="text" id="nc-name"></div>' +
      '<div class="form-group"><label>Director Name</label><input type="text" id="nc-director"></div>' +
      '<div class="form-group"><label>Address</label><input type="text" id="nc-address"></div>' +
      '<div class="flex-gap" style="justify-content:flex-end;"><button class="btn btn-secondary" id="nc-cancel">Cancel</button><button class="btn btn-primary" id="nc-confirm">Create</button></div>'
    );
    document.getElementById('nc-cancel').addEventListener('click', closeModal);
    document.getElementById('nc-confirm').addEventListener('click', async function() {
      const centreName = document.getElementById('nc-name').value.trim();
      if (!centreName) { showToast('Please enter a centre name.', 'error'); return; }
      closeModal();
      await api('createCentreFromSettings', { centreName: centreName, director: document.getElementById('nc-director').value, address: document.getElementById('nc-address').value });
      clearReferenceCache();
      showToast('Centre added.', 'success');
      renderCentresTab(contentEl);
    });
  });

  contentEl.querySelectorAll('.c-deactivate').forEach(function(btn) {
    btn.addEventListener('click', function() {
      showPasswordConfirmModal('Deactivate Centre', 'This centre will stop appearing throughout the app. Enter your password to confirm.', async function(pw) {
        await api('deactivateCentreFromSettings', Number(btn.dataset.row), pw);
        clearReferenceCache();
        showToast('Centre deactivated.', 'success');
        renderCentresTab(contentEl);
      });
    });
  });
}
</script>
