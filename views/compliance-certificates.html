<div class="flex-between mt-1" style="margin-bottom:1rem;">
  <h2 style="margin:0;">Compliance Certificates</h2>
  <div id="cert-centre-selector-wrapper" class="hidden" style="min-width:220px;">
    <select id="cert-centre-select"></select>
  </div>
</div>
<div class="flex-gap mt-1" style="margin-bottom:1rem;">
  <select id="cert-status-filter">
    <option value="All">All Statuses</option>
    <option value="overdue">🔴 Overdue</option>
    <option value="dueSoon">🟡 Due Soon</option>
    <option value="ok">🟢 OK</option>
    <option value="static">⚪ Static</option>
  </select>
  <button class="btn btn-secondary btn-small" id="cert-add-btn">+ Add Item</button>
</div>
<div id="cert-content"></div>

<script>
async function initComplianceCertificates() {
  const session = Session.get();
  const isAdmin = session.role === 'Area Manager' || session.role === 'Approved Provider';
  const wrapper = document.getElementById('cert-centre-selector-wrapper');
  let activeCentreId = session.centreId;

  if (isAdmin) {
    wrapper.classList.remove('hidden');
    const selectEl = document.getElementById('cert-centre-select');
    await populateCentreSelect(selectEl, function(centreId) {
      activeCentreId = centreId;
      renderCertificates(centreId);
    });
  } else {
    wrapper.classList.add('hidden');
    renderCertificates(session.centreId);
  }

  document.getElementById('cert-status-filter').addEventListener('change', function() {
    renderCertificates(activeCentreId);
  });

  document.getElementById('cert-add-btn').addEventListener('click', function() {
    openAddCertificateModal(activeCentreId, isAdmin, function() { renderCertificates(activeCentreId); });
  });
}

function certStatusBadge(status) {
  const map = {
    overdue: '<span class="badge badge-red">🔴 Overdue</span>',
    dueSoon: '<span class="badge badge-yellow">🟡 Due Soon</span>',
    ok: '<span class="badge badge-green">🟢 OK</span>',
    static: '<span class="badge badge-grey">⚪ Static</span>',
    unknown: '<span class="badge badge-grey">— No Date</span>'
  };
  return map[status] || map.unknown;
}

function chipHtml(dateVal, linkVal) {
  if (!dateVal) return '<span class="cert-chip cert-chip-empty">➕ empty</span>';
  const dateText = formatDateAU(dateVal);
  if (linkVal) {
    return '<a href="' + linkVal + '" target="_blank" class="cert-chip cert-chip-filled">📅 ' + dateText + ' 🔗</a>';
  }
  return '<span class="cert-chip cert-chip-filled">📅 ' + dateText + '</span>';
}

async function renderCertificates(centreId) {
  const contentEl = document.getElementById('cert-content');
  contentEl.innerHTML = '<p class="text-muted">Loading...</p>';
  const statusFilter = document.getElementById('cert-status-filter').value;
  const period = await getCurrentPeriodClient();

  const [items, headerInfo] = await Promise.all([
    api('getCertificatesData', centreId, statusFilter, 'All'),
    api('getTabHeaderInfo', 'Compliance Certificates', centreId, period.periodKey)
  ]);

  const session = Session.get();
  const isAP = session.role === 'Approved Provider';
  const isAM = session.role === 'Area Manager';
  const isOwnDirector = session.role === 'Director' && session.centreId === centreId;

  // Per governance rule: AP can always edit, even when approved/locked.
  // Director/AM are blocked once the tab is approved for this period.
  const canEdit = isAP || (!headerInfo.isReadOnly && (isAM || isOwnDirector));

  if (items.length === 0) {
    contentEl.innerHTML = '<p class="text-muted">No items match this filter.</p>';
    return;
  }

  let html = '';
  items.forEach(function(item) {
    const reviewed = item.lastReviewedPeriod === period.periodKey;
    html += '<div class="card cert-card">';
    html += '<div class="flex-between" style="align-items:flex-start;">';
    html += '<div><strong style="font-size:1.02rem;">' + item.itemName + '</strong>' +
      (canEdit ? ' <span class="header-edit-btn cert-edit-btn" data-row="' + item.rowIndex + '" title="Edit item details">✏️</span>' : '') + '</div>';
    html += certStatusBadge(item.status);
    html += '</div>';
    html += '<div class="text-muted" style="margin:0.2rem 0 0.75rem 0;">' + (item.vendorContact || 'No vendor/contact on file') + '</div>';

    html += '<div class="cert-meta-row">' +
      '<span><span class="text-muted">Frequency:</span> <strong>' + item.frequency + '</strong></span>' +
      '<span><span class="text-muted">Next Due:</span> <strong>' + item.nextDueDisplay + '</strong></span>' +
      '</div>';

    html += '<div class="cert-history-label">Completion History</div>';
    html += '<div class="cert-chip-row">';
    for (let s = 0; s < 6; s++) html += chipHtml(item.dates[s], item.links[s]);
    html += '</div>';

    html += '<div class="cert-footer-row mt-1">';
    html += '<label class="flex-gap" style="font-size:0.85rem;">' +
      '<input type="checkbox" class="cert-reviewed-checkbox" data-row="' + item.rowIndex + '" ' + (reviewed ? 'checked' : '') + ' ' + (!canEdit ? 'disabled' : '') + '> Reviewed this month</label>';
    if (canEdit && item.frequency !== 'Static') {
      html += '<button class="btn btn-secondary btn-small mark-completed-btn" data-row="' + item.rowIndex + '">Update</button>';
    }
    html += '</div>';
    html += '</div>';
  });
  contentEl.innerHTML = html;

  contentEl.querySelectorAll('.cert-reviewed-checkbox').forEach(function(cb) {
    cb.addEventListener('change', async function() {
      await api('markCertificateReviewed', centreId, Number(cb.dataset.row), period.periodKey);
      showToast('Marked as reviewed for this month.', 'success');
    });
  });

  contentEl.querySelectorAll('.mark-completed-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      openUpdateCompletionModal(centreId, Number(btn.dataset.row), function() { renderCertificates(centreId); });
    });
  });

  contentEl.querySelectorAll('.cert-edit-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      const item = items.find(function(it) { return it.rowIndex === Number(btn.dataset.row); });
      openEditCertificateDetailsModal(centreId, item, period.periodKey, function() { renderCertificates(centreId); });
    });
  });
}

function openUpdateCompletionModal(centreId, rowIndex, onDone) {
  showModal(
    '<h3 class="card-title">Update Completion</h3>' +
    '<div class="form-group"><label>Completion Date</label><input type="date" id="mc-date"></div>' +
    '<div class="form-group"><label>Link (Drive/Document URL)</label><input type="text" id="mc-link" placeholder="https://..."></div>' +
    '<div class="flex-gap" style="justify-content:flex-end;">' +
      '<button class="btn btn-secondary" id="mc-cancel">Cancel</button>' +
      '<button class="btn btn-primary" id="mc-confirm">Save</button>' +
    '</div>'
  );
  document.getElementById('mc-cancel').addEventListener('click', closeModal);
  document.getElementById('mc-confirm').addEventListener('click', async function() {
    const date = document.getElementById('mc-date').value;
    const link = document.getElementById('mc-link').value;
    if (!date) { showToast('Please select a date.', 'error'); return; }
    closeModal();
    await api('markCertificateCompleted', centreId, rowIndex, date, link);
    showToast('Certificate updated.', 'success');
    onDone();
  });
}

function openEditCertificateDetailsModal(centreId, item, periodKey, onDone) {
  const freqOptions = ['Monthly','Quarterly','6 Months','Yearly','2 Yearly','Static'];
  let optionsHtml = freqOptions.map(function(f) { return '<option ' + (item.frequency === f ? 'selected' : '') + '>' + f + '</option>'; }).join('');

  showModal(
    '<h3 class="card-title">Edit Item Details</h3>' +
    '<div class="form-group"><label>Item Name</label><input type="text" id="ed-name" value="' + item.itemName + '"></div>' +
    '<div class="form-group"><label>Frequency</label><select id="ed-freq">' + optionsHtml + '</select></div>' +
    '<div class="form-group"><label>Vendor/Contact</label><input type="text" id="ed-vendor" value="' + (item.vendorContact || '') + '"></div>' +
    '<div class="flex-gap" style="justify-content:flex-end;">' +
      '<button class="btn btn-secondary" id="ed-cancel">Cancel</button>' +
      '<button class="btn btn-primary" id="ed-confirm">Save</button>' +
    '</div>'
  );
  document.getElementById('ed-cancel').addEventListener('click', closeModal);
  document.getElementById('ed-confirm').addEventListener('click', async function() {
    const itemName = document.getElementById('ed-name').value.trim();
    const frequency = document.getElementById('ed-freq').value;
    const vendorContact = document.getElementById('ed-vendor').value;
    if (!itemName) { showToast('Item name cannot be blank.', 'error'); return; }
    closeModal();
    await api('editCertificateItemDetails', centreId, item.rowIndex, periodKey, itemName, frequency, vendorContact);
    showToast('Item updated.', 'success');
    onDone();
  });
}

function openAddCertificateModal(centreId, isAdmin, onAdded) {
  showModal(
    '<h3 class="card-title">Add Certificate Item</h3>' +
    '<div class="form-group"><label>Item Name</label><input type="text" id="ac-item-name"></div>' +
    '<div class="form-group"><label>Frequency</label><select id="ac-item-freq">' +
      '<option>Monthly</option><option>Quarterly</option><option>6 Months</option><option>Yearly</option><option>2 Yearly</option><option>Static</option>' +
    '</select></div>' +
    '<div class="form-group"><label>Vendor/Contact</label><input type="text" id="ac-item-vendor"></div>' +
    '<div class="flex-gap" style="justify-content:flex-end;">' +
      '<button class="btn btn-secondary" id="ac-cancel">Cancel</button>' +
      '<button class="btn btn-primary" id="ac-confirm">Add</button>' +
    '</div>'
  );
  document.getElementById('ac-cancel').addEventListener('click', closeModal);
  document.getElementById('ac-confirm').addEventListener('click', async function() {
    const itemName = document.getElementById('ac-item-name').value.trim();
    const frequency = document.getElementById('ac-item-freq').value;
    const vendorContact = document.getElementById('ac-item-vendor').value;
    if (!itemName) { showToast('Please enter an item name.', 'error'); return; }
    closeModal();
    await api('addCertificateItem', { itemName: itemName, frequency: frequency, vendorContact: vendorContact, centreName: null });
    showToast('Item added — pending AM/AP review before it appears at other centres.', 'success');
    onAdded();
  });
}
</script>
