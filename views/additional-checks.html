<div class="flex-between mt-1" style="margin-bottom:1rem;">
  <h2 style="margin:0;">Additional Checks</h2>
  <div id="ac-centre-selector-wrapper" class="hidden" style="min-width:220px;">
    <select id="ac-centre-select"></select>
  </div>
</div>
<div id="ac-header"></div>
<div id="ac-content" class="mt-1"></div>

<script>
async function initAdditionalChecks() {
  const session = Session.get();
  const isAdmin = session.role === 'Area Manager' || session.role === 'Approved Provider';
  const wrapper = document.getElementById('ac-centre-selector-wrapper');

  if (isAdmin) {
    wrapper.classList.remove('hidden');
    const selectEl = document.getElementById('ac-centre-select');
    await populateCentreSelect(selectEl, function(centreId) { renderAdditionalChecks(centreId); });
  } else {
    wrapper.classList.add('hidden');
    renderAdditionalChecks(session.centreId);
  }
}

function buildAcTable(items, canEditDir, canEditAdmin, labelMap) {
  if (items.length === 0) return '<p class="text-muted">No items scheduled.</p>';
  let html = '<div class="data-table"><div class="table-header">' +
    renderHeaderCell('col-text-short', lbl(labelMap, 'ItemName', 'Item'), 'Additional Checks', 'ItemName') +
    renderHeaderCell('col-narrow', lbl(labelMap, 'DirSelfAssess', 'Self-Assess'), 'Additional Checks', 'DirSelfAssess') +
    renderHeaderCell('col-text-long', lbl(labelMap, 'DirMitigation', 'Mitigation'), 'Additional Checks', 'DirMitigation') +
    renderHeaderCell('col-narrow', lbl(labelMap, 'ComplianceCheck', 'Compliance Check'), 'Additional Checks', 'ComplianceCheck') +
    renderHeaderCell('col-text-long', lbl(labelMap, 'ManagerNotes', 'Manager Notes'), 'Additional Checks', 'ManagerNotes') +
    renderHeaderCell('col-text-long', lbl(labelMap, 'DirectorNotes', 'Director Notes'), 'Additional Checks', 'DirectorNotes') + '</div>';
  items.forEach(function(item) {
    html += '<div class="table-row">';
    html += '<div class="col-text-short" data-label="Item"><textarea class="item-name-input" data-row="' + item.rowIndex + '" data-field="ItemName" rows="2" ' + (!canEditDir ? 'disabled' : '') + '>' + item.itemName + '</textarea>' + (item.rowOrigin === 'DirectorAdded' ? ' <span class="badge badge-blue">🆕</span>' : '') + '</div>';
    html += '<div class="col-narrow" data-label="Self-Assess">' + ynSelectHtml(item.rowIndex, 'DirSelfAssess', item.dirSelfAssess, !canEditDir) + '</div>';
    html += '<div class="col-text-long" data-label="Mitigation">' + textareaHtml(item.rowIndex, 'DirMitigation', item.dirMitigation, !canEditDir) + '</div>';
    html += '<div class="col-narrow" data-label="Compliance Check">' + ynSelectHtml(item.rowIndex, 'ComplianceCheck', item.adminCheck, !canEditAdmin) + '</div>';
    html += '<div class="col-text-long" data-label="Manager Notes">' + managerNotesHtml(item.rowIndex, item.managerNotes, !canEditAdmin) + '</div>';
    html += '<div class="col-text-long" data-label="Director Notes">' + textareaHtml(item.rowIndex, 'DirectorNotes', item.directorNotes, !canEditDir) + '</div>';
    html += '</div>';
  });
  html += '</div>';
  return html;
}

async function renderAdditionalChecks(centreId) {
  const headerEl = document.getElementById('ac-header');
  const contentEl = document.getElementById('ac-content');
  contentEl.innerHTML = '<p class="text-muted">Loading...</p>';

  const period = await getCurrentPeriodClient();
  const [data, headerInfo, labelMap] = await Promise.all([
    api('getAdditionalChecksData', centreId, period.periodKey),
    api('getTabHeaderInfo', 'Additional Checks', centreId, period.periodKey),
    getLabelMap('Additional Checks')
  ]);

  renderTabHeaderInfo(headerEl, headerInfo, 'Additional Checks', centreId, period.periodKey, function() {
    renderAdditionalChecks(centreId);
  });

  const session = Session.get();
  const isAdmin = session.role === 'Area Manager' || session.role === 'Approved Provider';
  const canEditDir = !headerInfo.isReadOnly && ((session.role === 'Director' && session.centreId === centreId) || isAdmin);
  const canEditAdmin = !headerInfo.isReadOnly && isAdmin;

  let html = '<div class="card"><h3 class="card-title">This Month</h3>' + buildAcTable(data.currentMonthItems, canEditDir, canEditAdmin, labelMap) + '</div>';

  data.lookAhead.forEach(function(p) {
    html += '<details class="card"><summary style="cursor:pointer; font-weight:600;">' + p.monthName + ' (look-ahead — editable now, not due yet)</summary>' +
      '<div class="mt-1">' + buildAcTable(p.items, canEditDir, canEditAdmin, labelMap) + '</div></details>';
  });

  contentEl.innerHTML = html;

  contentEl.addEventListener('change', function(e) { handleFieldSave(e, 'Additional Checks', centreId); });
  contentEl.addEventListener('focusout', function(e) { if (e.target.tagName === 'TEXTAREA') handleFieldSave(e, 'Additional Checks', centreId); });
}
</script>
