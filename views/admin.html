<h2 class="mt-1" style="margin-bottom:1rem;">Admin</h2>
<div class="flex-gap mt-1" style="margin-bottom:1rem; flex-wrap:wrap;">
  <button class="admin-tab-btn tab-wine active" data-tab="pending">Pending Review</button>
  <button class="admin-tab-btn tab-purple" data-tab="library">Master Item Library</button>
  <button class="admin-tab-btn tab-purple-alt" data-tab="categories">Feedback Categories</button>
  <button class="admin-tab-btn tab-navy" id="admin-tab-audit-btn" data-tab="audit">Audit Log &amp; System Health</button>
</div>
<div id="admin-content"></div>

<script>
async function initAdmin() {
  const session = Session.get();
  if (session.role !== 'Approved Provider') {
    document.getElementById('admin-tab-audit-btn').classList.add('hidden');
  }
  document.querySelectorAll('.admin-tab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.admin-tab-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      renderAdminTab(btn.dataset.tab);
    });
  });
  renderAdminTab('pending');
}

async function renderAdminTab(tab) {
  const contentEl = document.getElementById('admin-content');
  contentEl.innerHTML = '<p class="text-muted">Loading...</p>';
  if (tab === 'pending') return renderPendingReview(contentEl);
  if (tab === 'library') return renderMasterLibrary(contentEl);
  if (tab === 'categories') return renderFeedbackCategoriesAdmin(contentEl);
  if (tab === 'audit') return renderAuditLog(contentEl);
}

async function renderPendingReview(contentEl) {
  const items = await api('getAllPendingReviewItems');
  if (items.length === 0) { contentEl.innerHTML = '<p class="text-muted">No items pending review.</p>'; return; }

  let html = '<div class="data-table"><div class="table-header"><div class="col-text-short">Item</div><div class="col-text-short">Category</div><div class="col-text-short">Added By Centre</div><div class="col-narrow">Frequency</div><div class="col-text-short">Actions</div></div>';
  items.forEach(function(item) {
    html += '<div class="table-row">';
    html += '<div class="col-text-short" data-label="Item">' + item.itemName + '</div>';
    html += '<div class="col-text-short" data-label="Category">' + item.category + '</div>';
    html += '<div class="col-text-short" data-label="Centre">' + item.centreScope + '</div>';
    html += '<div class="col-narrow" data-label="Frequency">' + (item.frequencyLabel || '—') + '</div>';
    html += '<div class="col-text-short" data-label="Actions"><div class="flex-gap">' +
      '<button class="btn btn-primary btn-small pr-push" data-source="' + item.source + '" data-row="' + item.rowIndex + '">Push to All</button>' +
      '<button class="btn btn-secondary btn-small pr-keep" data-source="' + item.source + '" data-row="' + item.rowIndex + '">Keep Local</button>' +
      '<button class="btn btn-danger btn-small pr-remove" data-source="' + item.source + '" data-row="' + item.rowIndex + '">Remove</button></div></div>';
    html += '</div>';
  });
  html += '</div>';
  contentEl.innerHTML = html;

  contentEl.querySelectorAll('.pr-push, .pr-keep').forEach(function(btn) {
    btn.addEventListener('click', async function() {
      const action = btn.classList.contains('pr-push') ? 'push' : 'keepLocal';
      await api('reviewPendingItemUnified', btn.dataset.source, Number(btn.dataset.row), action, null);
      showToast('Item updated.', 'success');
      renderPendingReview(contentEl);
    });
  });
  contentEl.querySelectorAll('.pr-remove').forEach(function(btn) {
    btn.addEventListener('click', function() {
      showPasswordConfirmModal('Remove Item', 'This will stop this item from being used going forward. Enter your password to confirm.', async function(pw) {
        await api('reviewPendingItemUnified', btn.dataset.source, Number(btn.dataset.row), 'remove', pw);
        showToast('Item removed.', 'success');
        renderPendingReview(contentEl);
      });
    });
  });
}

async function renderMasterLibrary(contentEl) {
  contentEl.innerHTML =
    '<div class="flex-gap mt-1" style="margin-bottom:1rem;">' +
    '<select id="ml-category-filter"><option value="All">All Categories</option><option>OWNA Review</option><option>Additional Checks</option><option>Monthly Programming</option><option>SAWD QIP</option><option>Displays</option></select>' +
    '<input type="text" id="ml-search" placeholder="Search items...">' +
    '</div><div id="ml-results"></div>';

  const search = async function() {
    const category = document.getElementById('ml-category-filter').value;
    const searchText = document.getElementById('ml-search').value;
    const items = await api('getMasterLibraryForAdmin', category, searchText);
    const resultsEl = document.getElementById('ml-results');

    let html = '<div class="data-table"><div class="table-header"><div class="col-text-short">Item</div><div class="col-text-short">Category</div><div class="col-narrow">Frequency</div><div class="col-text-short">Scope</div></div>';
    items.forEach(function(item) {
      html += '<div class="table-row"><div class="col-text-short" data-label="Item">' + item.itemName + '</div>' +
        '<div class="col-text-short" data-label="Category">' + item.category + '</div>' +
        '<div class="col-narrow" data-label="Frequency">' + (item.frequencyLabel || '—') + '</div>' +
        '<div class="col-text-short" data-label="Scope">' + item.centreScope + '</div></div>';
    });
    html += '</div>';
    resultsEl.innerHTML = html;
  };

  document.getElementById('ml-category-filter').addEventListener('change', search);
  document.getElementById('ml-search').addEventListener('input', function() {
    clearTimeout(window._mlSearchDebounce);
    window._mlSearchDebounce = setTimeout(search, 300);
  });
  search();
}

async function renderFeedbackCategoriesAdmin(contentEl) {
  const categories = await api('getFeedbackCategories');
  let html = '<div class="card"><h3 class="card-title">Feedback Categories</h3><div class="data-table">';
  categories.forEach(function(c) {
    html += '<div class="table-row"><div class="col-text-short" data-label="Category">' + c + '</div>' +
      '<div class="col-narrow" data-label="Action"><button class="btn btn-danger btn-small fc-remove" data-name="' + c + '">Remove</button></div></div>';
  });
  html += '</div><div class="flex-gap mt-1"><input type="text" id="fc-new" placeholder="New category name"><button class="btn btn-primary btn-small" id="fc-add">Add</button></div></div>';
  contentEl.innerHTML = html;

  document.getElementById('fc-add').addEventListener('click', async function() {
    const name = document.getElementById('fc-new').value.trim();
    if (!name) return;
    await api('addFeedbackCategory', name);
    showToast('Category added.', 'success');
    renderFeedbackCategoriesAdmin(contentEl);
  });
  contentEl.querySelectorAll('.fc-remove').forEach(function(btn) {
    btn.addEventListener('click', function() {
      showPasswordConfirmModal('Remove Category', 'Enter your password to confirm removing "' + btn.dataset.name + '".', async function(pw) {
        await api('removeFeedbackCategory', btn.dataset.name, pw);
        showToast('Category removed.', 'success');
        renderFeedbackCategoriesAdmin(contentEl);
      });
    });
  });
}

async function renderAuditLog(contentEl) {
  const [entries, connections] = await Promise.all([api('getAuditLogEntries', 100, null), api('getConnectionsInfo')]);

  let html = '<div class="card"><h3 class="card-title">System Health</h3>' +
    '<p class="text-muted">Sheet: ' + connections.sheetName + '</p>' +
    '<p class="text-muted">Last Backup: ' + formatDateTimeAU(connections.lastBackupAt) + '</p>' +
    '<p class="text-muted">Actions logged (last 30 days): ' + connections.auditLogCount30Days + '</p>' +
    '<button class="btn btn-primary btn-small" id="force-backup-btn">Force Manual Backup</button></div>';

  html += '<div class="card"><h3 class="card-title">Recent Activity</h3><input type="text" id="audit-search" placeholder="Search log..." class="mt-1" style="margin-bottom:0.75rem;"><div class="data-table" id="audit-table"></div></div>';
  contentEl.innerHTML = html;

  function renderRows(rows) {
    let rowsHtml = '<div class="table-header"><div class="col-date">Time</div><div class="col-text-short">User</div><div class="col-text-short">Action</div><div class="col-text-long">Details</div></div>';
    rows.forEach(function(r) {
      rowsHtml += '<div class="table-row"><div class="col-date" data-label="Time">' + formatDateTimeAU(r.timestamp) + '</div>' +
        '<div class="col-text-short" data-label="User">' + r.loginId + '</div>' +
        '<div class="col-text-short" data-label="Action">' + r.action + '</div>' +
        '<div class="col-text-long" data-label="Details">' + (r.details || '—') + '</div></div>';
    });
    document.getElementById('audit-table').innerHTML = rowsHtml;
  }
  renderRows(entries);

  document.getElementById('audit-search').addEventListener('input', function() {
    clearTimeout(window._auditDebounce);
    window._auditDebounce = setTimeout(async function() {
      const results = await api('getAuditLogEntries', 100, this.value);
      renderRows(results);
    }.bind(this), 300);
  });

  document.getElementById('force-backup-btn').addEventListener('click', function() {
    showPasswordConfirmModal('Force Manual Backup', 'Enter your password to create a backup copy now.', async function(pw) {
      await api('forceManualBackup', pw);
      showToast('Backup created successfully.', 'success');
      renderAuditLog(contentEl);
    });
  });
}
</script>
