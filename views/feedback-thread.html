<div class="flex-between mt-1" style="margin-bottom:1rem;">
  <h2 style="margin:0;">AP / AM Feedback</h2>
  <div id="ft-centre-selector-wrapper" class="hidden" style="min-width:220px;">
    <select id="ft-centre-select"></select>
  </div>
</div>
<div class="flex-gap mt-1" style="margin-bottom:1rem; flex-wrap:wrap;">
  <select id="ft-status-filter">
    <option value="OpenDeferred">Open + Deferred</option>
    <option value="Open">Open only</option>
    <option value="Deferred">Deferred only</option>
    <option value="Resolved">Resolved (last 3 months)</option>
    <option value="ShowAll">Show All</option>
  </select>
  <select id="ft-category-filter"><option value="All">All Categories</option></select>
  <button class="btn btn-secondary btn-small" id="ft-add-btn">+ New Entry</button>
</div>
<p class="text-muted mt-1" style="margin-bottom:0.75rem; font-size:0.85rem;">💾 Entries save automatically. There is no Submit/Approve step.</p>
<div id="ft-content"></div>

<script>
const FEEDBACK_CATEGORY_BADGE_COLORS = ['badge-blue','badge-green','badge-yellow','badge-orange','badge-grey'];
function categoryBadgeClass(category) {
  const idx = ftAllCategories.indexOf(category);
  return FEEDBACK_CATEGORY_BADGE_COLORS[idx % FEEDBACK_CATEGORY_BADGE_COLORS.length] || 'badge-grey';
}

let ftAllCategories = [];

async function initFeedbackThread() {
  const session = Session.get();
  const isAdmin = session.role === 'Area Manager' || session.role === 'Approved Provider';
  const wrapper = document.getElementById('ft-centre-selector-wrapper');
  let activeCentreId = session.centreId;

  ftAllCategories = await api('getFeedbackCategories');
  const catSelect = document.getElementById('ft-category-filter');
  ftAllCategories.forEach(function(c) {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    catSelect.appendChild(opt);
  });

  if (isAdmin) {
    wrapper.classList.remove('hidden');
    const selectEl = document.getElementById('ft-centre-select');
    await populateCentreSelect(selectEl, function(centreId) { activeCentreId = centreId; renderFeedback(centreId); });
  } else {
    wrapper.classList.add('hidden');
    renderFeedback(session.centreId);
  }

  document.getElementById('ft-status-filter').addEventListener('change', function() { renderFeedback(activeCentreId); });
  document.getElementById('ft-category-filter').addEventListener('change', function() { renderFeedback(activeCentreId); });

  document.getElementById('ft-add-btn').addEventListener('click', function() {
    let optionsHtml = ftAllCategories.map(function(c) { return '<option>' + c + '</option>'; }).join('');
    showModal(
      '<h3 class="card-title">New Feedback Entry</h3>' +
      '<div class="form-group"><label>Category</label><select id="ft-category">' + optionsHtml + '</select></div>' +
      '<div class="form-group"><label>Message</label><textarea id="ft-message" rows="4"></textarea></div>' +
      '<div class="flex-gap" style="justify-content:flex-end;"><button class="btn btn-secondary" id="ft-cancel">Cancel</button><button class="btn btn-primary" id="ft-confirm">Post</button></div>'
    );
    document.getElementById('ft-cancel').addEventListener('click', closeModal);
    document.getElementById('ft-confirm').addEventListener('click', async function() {
      const message = document.getElementById('ft-message').value.trim();
      const category = document.getElementById('ft-category').value;
      if (!message) { showToast('Please enter a message.', 'error'); return; }
      closeModal();
      await api('addFeedbackEntry', activeCentreId, message, category);
      showToast('Entry posted.', 'success');
      renderFeedback(activeCentreId);
    });
  });
}

function truncateMessage(msg, len) {
  if (!msg || msg.length <= len) return { short: msg, isTruncated: false };
  return { short: msg.substring(0, len) + '…', isTruncated: true };
}

function statusSelectHtmlFeedback(rowIndex, status) {
  const options = ['Open', 'Deferred', 'Resolved'];
  let html = '<select data-row="' + rowIndex + '" data-field="Status">';
  options.forEach(function(o) { html += '<option value="' + o + '" ' + (status === o ? 'selected' : '') + '>' + o + '</option>'; });
  return html + '</select>';
}

async function renderFeedback(centreId) {
  const contentEl = document.getElementById('ft-content');
  contentEl.innerHTML = '<p class="text-muted">Loading...</p>';
  const statusFilter = document.getElementById('ft-status-filter').value;
  const categoryFilter = document.getElementById('ft-category-filter').value;
  const items = await api('getFeedbackThread', centreId, statusFilter, categoryFilter);

  if (items.length === 0) { contentEl.innerHTML = '<p class="text-muted">No entries match this filter.</p>'; return; }

  let html = '<div class="data-table"><div class="table-header">' +
    '<div class="col-date">Date</div>' +
    '<div class="col-text-short">Author</div>' +
    '<div class="col-narrow">Category</div>' +
    '<div class="col-text-long">Message</div>' +
    '<div class="col-date">Action Date</div>' +
    '<div class="col-narrow">Status</div>' +
    '<div class="col-date">Resolved Date</div>' +
    '</div>';

  items.forEach(function(item) {
    const t = truncateMessage(item.message, 80);
    const hasAction = !!item.actionRequired;
    html += '<div class="table-row">';
    html += '<div class="col-date" data-label="Date">' + formatDateAU(item.dateOfComment) + '</div>';
    html += '<div class="col-text-short" data-label="Author">' + item.author + '</div>';
    html += '<div class="col-narrow" data-label="Category"><span class="badge ' + categoryBadgeClass(item.category) + '">' + item.category + '</span></div>';
    html += '<div class="col-text-long" data-label="Message">' + t.short +
      (t.isTruncated ? ' <a href="#" class="ft-show-more" data-full="' + item.message.replace(/"/g, '&quot;') + '">Show more</a>' : '') + '</div>';
    html += '<div class="col-date" data-label="Action Date">' +
      (hasAction
        ? '<span>' + formatDateAU(item.actionRequired) + '</span> <button type="button" class="btn btn-secondary btn-small ft-action-clear" data-row="' + item.rowIndex + '">✕</button>'
        : '<button type="button" class="btn btn-secondary btn-small ft-action-set" data-row="' + item.rowIndex + '">+ Flag</button>') +
      '</div>';
    html += '<div class="col-narrow" data-label="Status">' + statusSelectHtmlFeedback(item.rowIndex, item.status) + '</div>';
    html += '<div class="col-date" data-label="Resolved Date">' + (item.status === 'Resolved' ? formatDateAU(item.resolvedAt) : '—') + '</div>';
    html += '</div>';
  });
  html += '</div>';
  contentEl.innerHTML = html;

  contentEl.querySelectorAll('.ft-show-more').forEach(function(a) {
    a.addEventListener('click', function(e) {
      e.preventDefault();
      showModal('<h3 class="card-title">Full Message</h3><p style="white-space:pre-wrap;">' + a.dataset.full + '</p><button class="btn btn-secondary" id="ft-msg-close">Close</button>');
      document.getElementById('ft-msg-close').addEventListener('click', closeModal);
    });
  });

  contentEl.querySelectorAll('.ft-action-set').forEach(function(btn) {
    btn.addEventListener('click', async function() {
      await api('saveFeedbackField', centreId, Number(btn.dataset.row), 'ActionRequired', 'SET');
      renderFeedback(centreId);
    });
  });
  contentEl.querySelectorAll('.ft-action-clear').forEach(function(btn) {
    btn.addEventListener('click', async function() {
      await api('saveFeedbackField', centreId, Number(btn.dataset.row), 'ActionRequired', 'CLEAR');
      renderFeedback(centreId);
    });
  });

  contentEl.addEventListener('change', function(e) {
    if (!e.target.dataset.field) return;
    api('saveFeedbackField', centreId, Number(e.target.dataset.row), e.target.dataset.field, e.target.value).then(function() {
      renderFeedback(centreId);
    });
  });
}
</script>
