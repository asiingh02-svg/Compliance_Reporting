<div class="flex-between mt-1" style="margin-bottom:1rem;">
  <h2 style="margin:0;">Supplied Devices</h2>
  <div id="sd-centre-selector-wrapper" class="hidden" style="min-width:220px;">
    <select id="sd-centre-select"></select>
  </div>
</div>
<button class="btn btn-secondary btn-small mt-1" id="sd-add-btn" style="margin-bottom:1rem;">+ Add Device</button>
<div id="sd-content"></div>

<script>
async function initSuppliedDevices() {
  const session = Session.get();
  const isAdmin = session.role === 'Area Manager' || session.role === 'Approved Provider';
  const wrapper = document.getElementById('sd-centre-selector-wrapper');
  let activeCentreId = session.centreId;

  if (isAdmin) {
    wrapper.classList.remove('hidden');
    const selectEl = document.getElementById('sd-centre-select');
    await populateCentreSelect(selectEl, function(centreId) { activeCentreId = centreId; renderDevices(centreId); });
  } else {
    wrapper.classList.add('hidden');
    renderDevices(session.centreId);
  }

  document.getElementById('sd-add-btn').addEventListener('click', function() {
    showModal(
      '<h3 class="card-title">Add Device</h3>' +
      '<div class="form-group"><label>Device Type</label><input type="text" id="sd-type"></div>' +
      '<div class="form-group"><label>Brand</label><input type="text" id="sd-brand"></div>' +
      '<div class="form-group"><label>Serial Number</label><input type="text" id="sd-serial"></div>' +
      '<div class="form-group"><label>Location</label><input type="text" id="sd-location"></div>' +
      '<div class="form-group"><label>Allocated To</label><input type="text" id="sd-allocated"></div>' +
      '<div class="flex-gap" style="justify-content:flex-end;"><button class="btn btn-secondary" id="sd-cancel">Cancel</button><button class="btn btn-primary" id="sd-confirm">Add</button></div>'
    );
    document.getElementById('sd-cancel').addEventListener('click', closeModal);
    document.getElementById('sd-confirm').addEventListener('click', async function() {
      const deviceType = document.getElementById('sd-type').value.trim();
      if (!deviceType) { showToast('Please enter a device type.', 'error'); return; }
      closeModal();
      await api('addSuppliedDeviceRow', {
        deviceType: deviceType,
        deviceBrand: document.getElementById('sd-brand').value,
        serialNumber: document.getElementById('sd-serial').value,
        deviceLocation: document.getElementById('sd-location').value,
        allocatedTo: document.getElementById('sd-allocated').value
      });
      showToast('Device added.', 'success');
      renderDevices(activeCentreId);
    });
  });
}

async function renderDevices(centreId) {
  const contentEl = document.getElementById('sd-content');
  contentEl.innerHTML = '<p class="text-muted">Loading...</p>';
  const items = await api('getSuppliedDevicesData', centreId);

    let html = '<div class="data-table"><div class="table-header">' +
    renderHeaderCell('col-text-short', 'Device', 'Supplied Devices', 'DeviceType') +
    renderHeaderCell('col-text-short', 'Location', 'Supplied Devices', 'DeviceLocation') +
    renderHeaderCell('col-date', 'Declared', 'Supplied Devices', 'DeclarationDate') +
    renderHeaderCell('col-text-short', 'Allocated To', 'Supplied Devices', 'AllocatedTo') +
    renderHeaderCell('col-date', 'Last Review', 'Supplied Devices', 'LastReviewDate') +
    renderHeaderCell('col-text-long', 'Comments', 'Supplied Devices', 'Comments') + '</div>';
  contentEl.insertAdjacentHTML('beforebegin', '<p class="text-muted mt-1" style="margin-bottom:0.75rem; font-size:0.85rem;">💾 This is an ongoing register — every change saves automatically as you edit it. There is no Submit/Approve step for this tab.</p>');

  items.forEach(function(item) {
    html += '<div class="table-row">';
    html += '<div class="col-text-short" data-label="Device"><input type="text" data-row="' + item.rowIndex + '" data-field="DeviceType" value="' + item.deviceType + '">' + (item.deviceBrand ? '<br><span class="text-muted">' + item.deviceBrand + ' — ' + (item.serialNumber || '') + '</span>' : '') + '</div>';
    html += '<div class="col-text-short" data-label="Location">' + (item.deviceLocation || '—') + '</div>';
    html += '<div class="col-date" data-label="Declared">' + formatDateAU(item.declarationDate) + '</div>';
    html += '<div class="col-text-short" data-label="Allocated To">' + (item.allocatedTo || '—') + '</div>';
    html += '<div class="col-date" data-label="Last Review"><input type="date" data-row="' + item.rowIndex + '" data-field="LastReviewDate" value="' + dateForInput(item.lastReviewDate) + '"></div>';
    html += '<div class="col-text-long" data-label="Comments">' + textareaHtml(item.rowIndex, 'Comments', item.comments, false) + '</div>';
    html += '</div>';
  });
  html += '</div>';
  contentEl.innerHTML = html;

  contentEl.addEventListener('change', function(e) {
    if (!e.target.dataset.field) return;
    api('saveSuppliedDeviceField', centreId, Number(e.target.dataset.row), e.target.dataset.field, e.target.value);
  });
  contentEl.addEventListener('focusout', function(e) {
    if (e.target.tagName === 'TEXTAREA' && e.target.dataset.field) {
      api('saveSuppliedDeviceField', centreId, Number(e.target.dataset.row), e.target.dataset.field, e.target.value);
    }
  });
}
</script>
