<div class="flex-between mt-1" style="margin-bottom:1rem;">
  <h2 style="margin:0;">Appraisals &amp; Meetings</h2>
  <div id="ap-centre-selector-wrapper" class="hidden" style="min-width:220px;">
    <select id="ap-centre-select"></select>
  </div>
</div>
<button class="btn btn-secondary btn-small mt-1" id="ap-add-btn" style="margin-bottom:1rem;">+ Add Appraisal</button>
<div id="ap-content"></div>

<script>
async function initAppraisals() {
  const session = Session.get();
  const isAdmin = session.role === 'Area Manager' || session.role === 'Approved Provider';
  const wrapper = document.getElementById('ap-centre-selector-wrapper');
  let activeCentreId = session.centreId;

  if (isAdmin) {
    wrapper.classList.remove('hidden');
    const selectEl = document.getElementById('ap-centre-select');
    await populateCentreSelect(selectEl, function(centreId) { activeCentreId = centreId; renderAppraisals(centreId); });
  } else {
    wrapper.classList.add('hidden');
    renderAppraisals(session.centreId);
  }

  document.getElementById('ap-add-btn').addEventListener('click', function() {
    showModal(
      '<h3 class="card-title">Add Appraisal</h3>' +
      '<div class="form-group"><label>Staff Name</label><input type="text" id="ap-name"></div>' +
      '<div class="form-group"><label>Appraisal Type</label><input type="text" id="ap-type" placeholder="e.g. Mid-Year, Annual"></div>' +
      '<div class="form-group"><label>Date</label><input type="date" id="ap-date"></div>' +
      '<div class="flex-gap" style="justify-content:flex-end;"><button class="btn btn-secondary" id="ap-cancel">Cancel</button><button class="btn btn-primary" id="ap-confirm">Add</button></div>'
    );
    document.getElementById('ap-cancel').addEventListener('click', closeModal);
    document.getElementById('ap-confirm').addEventListener('click', async function() {
      const name = document.getElementById('ap-name').value.trim();
      const type = document.getElementById('ap-type').value.trim();
      const date = document.getElementById('ap-date').value;
      if (!name || !date) { showToast('Please enter a name and date.', 'error'); return; }
      closeModal();
      await api('addAppraisalRow', name, type, date);
      showToast('Appraisal added.', 'success');
      renderAppraisals(activeCentreId);
    });
  });
}

async function renderAppraisals(centreId) {
  const contentEl = document.getElementById('ap-content');
  contentEl.innerHTML = '<p class="text-muted">Loading...</p>';
  const items = await api('getAppraisalsData', centreId);
  const session = Session.get();
  const isAdmin = session.role === 'Area Manager' || session.role === 'Approved Provider';
  const canEditDir = (session.role === 'Director' && session.centreId === centreId) || isAdmin;
  const canEditAdmin = isAdmin;

    let html = '<div class="data-table"><div class="table-header">' +
    renderHeaderCell('col-text-short', 'Staff', 'Appraisals Meetings', 'StaffName') +
    renderHeaderCell('col-text-short', 'Type', 'Appraisals Meetings', 'AppraisalType') +
    renderHeaderCell('col-date', 'Date', 'Appraisals Meetings', 'AppraisalDate') +
    renderHeaderCell('col-narrow', 'Self-Assess', 'Appraisals Meetings', 'DirSelfAssess') +
    renderHeaderCell('col-narrow', 'Minutes Published', 'Appraisals Meetings', 'MinutesPublished') +
    renderHeaderCell('col-text-long', 'Mitigation', 'Appraisals Meetings', 'DirMitigation') +
    renderHeaderCell('col-narrow', 'Manager Check', 'Appraisals Meetings', 'ManagerCheck') +
    renderHeaderCell('col-text-long', 'Manager Notes', 'Appraisals Meetings', 'ManagerNotes') +
    renderHeaderCell('col-text-long', 'Director Notes', 'Appraisals Meetings', 'DirectorNotes') + '</div>';

  items.forEach(function(item) {
    html += '<div class="table-row">';
    html += '<div class="col-text-short" data-label="Staff"><strong>' + item.staffName + '</strong></div>';
    html += '<div class="col-text-short" data-label="Type">' + (item.appraisalType || '—') + '</div>';
    html += '<div class="col-date" data-label="Date">' + formatDateAU(item.appraisalDate) + '</div>';
    html += '<div class="col-narrow" data-label="Self-Assess">' + ynSelectHtml(item.rowIndex, 'DirSelfAssess', item.dirSelfAssess, !canEditDir) + '</div>';
    html += '<div class="col-narrow" data-label="Minutes Published">' + ynSelectHtml(item.rowIndex, 'MinutesPublished', item.minutesPublished, !canEditAdmin) + '</div>';
    html += '<div class="col-text-long" data-label="Mitigation">' + textareaHtml(item.rowIndex, 'DirMitigation', item.dirMitigation, !canEditDir) + '</div>';
    html += '<div class="col-narrow" data-label="Manager Check">' + ynSelectHtml(item.rowIndex, 'ManagerCheck', item.managerCheck, !canEditAdmin) + '</div>';
    html += '<div class="col-text-long" data-label="Manager Notes">' + textareaHtml(item.rowIndex, 'ManagerNotes', item.managerNotes, !canEditAdmin) + '</div>';
    html += '<div class="col-text-long" data-label="Director Notes">' + textareaHtml(item.rowIndex, 'DirectorNotes', item.directorNotes, !canEditDir) + '</div>';
    html += '</div>';
  });
  html += '</div>';
  contentEl.innerHTML = html;

  contentEl.addEventListener('change', function(e) {
    if (!e.target.dataset.field) return;
    api('saveAppraisalField', centreId, Number(e.target.dataset.row), e.target.dataset.field, e.target.value);
  });
  contentEl.addEventListener('focusout', function(e) {
    if (e.target.tagName === 'TEXTAREA' && e.target.dataset.field) {
      api('saveAppraisalField', centreId, Number(e.target.dataset.row), e.target.dataset.field, e.target.value);
    }
  });
}
</script>
