<div class="flex-between mt-1" style="margin-bottom:1rem;">
  <h2 style="margin:0;">OWNA Review</h2>
  <div id="owna-centre-selector-wrapper" class="hidden" style="min-width:220px;">
    <select id="owna-centre-select"></select>
  </div>
</div>
<div id="owna-header"></div>
<div id="owna-content" class="mt-1"></div>

<script>
async function initOwnaReview() {
  const session = Session.get();
  const isAdmin = session.role === 'Area Manager' || session.role === 'Approved Provider';
  const headerEl = document.getElementById('owna-header');
  const contentEl = document.getElementById('owna-content');
  const wrapper = document.getElementById('owna-centre-selector-wrapper');

  if (isAdmin) {
    wrapper.classList.remove('hidden');
    const selectEl = document.getElementById('owna-centre-select');
    await populateCentreSelect(selectEl, function(centreId) {
      renderChecklistTab('OWNA Review', contentEl, headerEl, centreId);
    });
  } else {
    wrapper.classList.add('hidden');
    renderChecklistTab('OWNA Review', contentEl, headerEl, session.centreId);
  }
}
</script>
