<div class="flex-between mt-1" style="margin-bottom:1rem;">
  <h2 style="margin:0;">Staff Social Media Consent</h2>
  <div id="smc-centre-selector-wrapper" class="hidden" style="min-width:220px;">
    <select id="smc-centre-select"></select>
  </div>
</div>
<button class="btn btn-secondary btn-small mt-1" id="smc-add-btn" style="margin-bottom:1rem;">+ Add Staff Member</button>
<div id="smc-content"></div>

<script>
const SMC_FIELDS = [
  { key: 'PhotosConsent', label: 'Photos' },
  { key: 'VideosConsent', label: 'Videos' },
  { key: 'BirthdayPostConsent', label: 'Birthday' },
  { key: 'WorkAnniversaryConsent', label: 'Anniversary' },
  { key: 'StaffShoutoutsConsent', label: 'Shoutouts' }
];

async function initSocialMediaConsent() {
  const session = Session.get();
  const isAdmin = session.role === 'Area Manager' || session.role === 'Approved Provider';
  const wrapper = document.getElementById('smc-centre-selector-wrapper');
  let activeCentreId = session.centreId;

  if (isAdmin) {
    wrapper.classList.remove('hidden');
    const selectEl = document.getElementById('smc-centre-select');
    await populateCentreSelect(selectEl, function(centreId) { activeCentreId = centreId; renderSocialConsent(centreId); });
  } else {
    wrapper.classList.add('hidden');
    renderSocialConsent(session.centreId);
  }

  document.getElementById('smc-add-btn').addEventListener('click', function() {
    showModal(
      '<h3 class="card-title">Add Staff Member</h3>' +
      '<div class="form-group"><label>Staff Name</label><input type="text" id="smc-name"></div>' +
      '<div class="form-group"><label>Role</label><input type="text" id="smc-role"></div>' +
      '<div class="flex-gap" style="justify-content:flex-end;"><button class="btn btn-secondary" id="smc-cancel">Cancel</button><button class="btn btn-primary" id="smc-confirm">Add</button></div>'
    );
    document.getElementById('smc-cancel').addEventListener('click', closeModal);
    document.getElementById('smc-confirm').addEventListener('click', async function() {
      const name = document.getElementById('smc-name').value.trim();
      const role = document.getElementById('smc-role').value.trim();
      if (!name) { showToast('Please enter a name.', 'error'); return; }
      closeModal();
      await api('addSocialMediaConsentRow', name, role);
      showToast('Staff member added.', 'success');
      renderSocialConsent(activeCentreId);
    });
  });
}

async function renderSocialConsent(centreId) {
  const contentEl = document.getElementById('smc-content');
  contentEl.innerHTML = '<p class="text-muted">Loading...</p>';
  const items = await api('getSocialMediaConsentData', centreId);

  let html = '<div class="data-table"><div class="table-header">' +
    renderHeaderCell('col-text-short', 'Staff Name', 'Staff Social Media Consent', 'StaffName') +
    renderHeaderCell('col-text-short', 'Role', 'Staff Social Media Consent', 'Role');
  SMC_FIELDS.forEach(function(f) { html += renderHeaderCell('col-narrow', f.label, 'Staff Social Media Consent', f.key); });
    html += renderHeaderCell('col-text-long', 'Notes', 'Staff Social Media Consent', 'Notes') + '</div>';
  contentEl.insertAdjacentHTML('beforebegin', '<p class="text-muted mt-1" style="margin-bottom:0.75rem; font-size:0.85rem;">💾 This is an ongoing register — every change saves automatically as you edit it. There is no Submit/Approve step for this tab.</p>');

  items.forEach(function(item) {
    html += '<div class="table-row"><div class="col-text-short" data-label="Staff Name"><input type="text" data-row="' + item.rowIndex + '" data-field="StaffName" value="' + item.staffName + '"></div>';
    html += '<div class="col-text-short" data-label="Role"><input type="text" data-row="' + item.rowIndex + '" data-field="Role" value="' + (item.role || '') + '"></div>';
    SMC_FIELDS.forEach(function(f) {
      html += '<div class="col-narrow" data-label="' + f.label + '">' + ynSelectHtml(item.rowIndex, f.key, item[f.key], false) + '</div>';
    });
    html += '<div class="col-text-long" data-label="Notes">' + textareaHtml(item.rowIndex, 'Notes', item.notes, false) + '</div>';
    html += '</div>';
  });
  html += '</div>';
  contentEl.innerHTML = html;

  contentEl.addEventListener('change', function(e) {
    if (!e.target.dataset.field) return;
    api('saveSocialMediaConsentField', centreId, Number(e.target.dataset.row), e.target.dataset.field, e.target.value);
  });
  contentEl.addEventListener('focusout', function(e) {
    if (e.target.tagName === 'TEXTAREA' && e.target.dataset.field) {
      api('saveSocialMediaConsentField', centreId, Number(e.target.dataset.row), e.target.dataset.field, e.target.value);
    }
  });
}
</script>
